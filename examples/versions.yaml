      notes:
        - Kubernetes is a later compatibility-gated integration, not a base requirement.
  volcano:
    status: not_checked
    constraints:
      version: null
      notes:
        - Volcano is only evaluated after Kubernetes is proven stable.
  hami:
    status: not_checked
    constraints:
      version: null
      notes:
        - HAMi is only evaluated after Kubernetes and Volcano are stable.

