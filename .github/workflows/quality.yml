name: quality

on:
  push:
    branches:
      - main
      - "001-*"
  pull_request:

jobs:
  quality:
    name: "${{ matrix.os }} / Conda Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: shardgrid-ci
          python-version: ${{ matrix.python-version }}
          auto-update-conda: false

      - name: Install package and quality tools
        run: |
          conda info
          conda env list
          command -v python
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify package import
        run: python -c "import shardgrid; print(shardgrid.__file__)"

      - name: Run pytest
        run: pytest -q

      - name: Run Ruff
        run: ruff check

      - name: Run mypy
        run: mypy
