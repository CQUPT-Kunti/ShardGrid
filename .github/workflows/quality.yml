name: quality

on:
  push:
    branches:
      - main
      - "001-*"
  pull_request:

jobs:
  quality:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify package import
        run: python -c "import shardgrid; print(shardgrid.__file__)"

      - name: Run pytest
        run: pytest -q

      - name: Run Ruff
        run: ruff check

      - name: Run mypy
        run: mypy
