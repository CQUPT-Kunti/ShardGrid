$schema: "https://json-schema.org/draft/2020-12/schema"
title: JobStatus
type: object
required:
  - job_id
  - state
  - phase
properties:
  job_id:
    type: string
    minLength: 1
  state:
    enum:
      - created
      - probing
      - planning
      - snapshotting
      - distributing
      - launching
      - rendezvous
      - training
      - checkpointing
      - completed
      - failed
      - stopping
      - stopped
  phase:
    type: string
    minLength: 1
  workers:
    type: array
    items:
      type: string
  latest_loss:
    type:
      - number
      - "null"
  loss_history:
    type: array
    items:
      type: number
  backend:
    type:
      - string
      - "null"
  fallback_used:
    type: boolean
  started_at:
    type:
      - string
      - "null"
  finished_at:
    type:
      - string
      - "null"
  failure:
    type:
      - object
      - "null"
    required:
      - stage
      - host
      - message
      - recommended_action
    properties:
      stage:
        enum:
          - BOOTSTRAP
          - PROBE
          - NETWORK
          - PROFILE
          - PLAN
          - DISTRIBUTE
          - LAUNCH
          - RENDEZVOUS
          - TRAIN
          - CHECKPOINT
          - SCHEDULE
          - GPU_SHARE
          - STOP
          - CLEANUP
      host:
        type: string
        minLength: 1
      worker_id:
        type:
          - string
          - "null"
      command:
        type:
          - string
          - "null"
      exit_code:
        type:
          - integer
          - "null"
      stdout_path:
        type:
          - string
          - "null"
      stderr_path:
        type:
          - string
          - "null"
      message:
        type: string
        minLength: 1
      recommended_action:
        type: string
        minLength: 1
      retryable:
        type: boolean
      manual_action_required:
        type: boolean
    additionalProperties: false
  checkpoint_ref:
    type:
      - string
      - "null"
additionalProperties: false
allOf:
  - if:
      properties:
        state:
          const: failed
      required:
        - state
    then:
      required:
        - failure
      properties:
        failure:
          type: object
  - if:
      properties:
        state:
          const: completed
      required:
        - state
    then:
      required:
        - checkpoint_ref
      properties:
        checkpoint_ref:
          type: string
          minLength: 1
