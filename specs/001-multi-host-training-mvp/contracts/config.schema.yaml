schemas:
  ClusterConfig:
    type: object
    required:
      - workers
    properties:
      jobs_root:
        type: string
        description: Configurable Control-node job snapshot root.
      default_ports:
        type: object
        properties:
          rendezvous:
            type: integer
            default: 29500
          iperf3:
            type: integer
            default: 5201
      workers:
        type: array
        minItems: 1
        items:
          $ref: "#/schemas/WorkerConfig"

  WorkerConfig:
    type: object
    required:
      - id
      - physical_os
      - runtime
      - host
      - ssh_user
    properties:
      id:
        type: string
      physical_os:
        enum: [linux, windows]
      runtime:
        enum: [native_linux, wsl2]
      runtime_os:
        enum: [linux, wsl2_linux]
      host:
        type: string
      ssh_user:
        type: string
      ssh_port:
        type: integer
        default: 22
      wsl_distro:
        type: string
        default: Ubuntu
      local_world_size:
        type: integer
        default: 1
      labels:
        type: object
        additionalProperties:
          type: string
      enabled:
        type: boolean
        default: true

  TrainingConfig:
    type: object
    required:
      - job
      - model
      - resources
    properties:
      job:
        type: object
        required: [name]
        properties:
          name:
            type: string
          backend:
            enum: [ssh, kubernetes, volcano, auto]
            default: ssh
          communication_backend:
            enum: [nccl, gloo, auto]
            default: auto
      model:
        type: object
        required: [name, type]
        properties:
          name:
            type: string
          type:
            enum: [minimal_transformer, minimal_sequential]
          stage_count:
            type: integer
            default: 2
          max_train_minutes:
            type: integer
            default: 15
          min_loss_decrease_percent:
            type: number
            default: 5.0
      resources:
        type: object
        required: [world_size]
        properties:
          world_size:
            type: integer
            default: 2
          preferred_workers:
            type: array
            items:
              type: string
          worker_overrides:
            type: object
            additionalProperties:
              type: object
      artifacts:
        type: object
        properties:
          snapshot_name:
            type: string
          keep_failed_snapshots:
            type: boolean
            default: true
