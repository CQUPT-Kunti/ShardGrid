$schema: "https://json-schema.org/draft/2020-12/schema"
title: ExecutionPlan
type: object
required:
  - job_id
  - engine
  - backend
  - world_size
  - master
  - workers
properties:
  job_id:
    type: string
    minLength: 1
  engine:
    type: string
    minLength: 1
  backend:
    type: string
    minLength: 1
  world_size:
    type: integer
    minimum: 1
  master:
    type: object
    required:
      - address
      - port
    properties:
      address:
        type: string
        minLength: 1
      port:
        type: integer
        minimum: 1
        maximum: 65535
    additionalProperties: false
  workers:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - worker_id
        - rank
        - local_rank
      properties:
        worker_id:
          type: string
          minLength: 1
        rank:
          type: integer
          minimum: 0
        local_rank:
          type: integer
          const: 0
        stage:
          type:
            - string
            - "null"
        stage_metadata_ref:
          type:
            - string
            - "null"
        estimated_peak_training_memory:
          type:
            - integer
            - "null"
          minimum: 0
        communication_edges:
          type: array
          items:
            type: string
        gpu_index:
          type: integer
          minimum: 0
        conda_environment:
          type:
            - string
            - "null"
        conda_prefix:
          type:
            - string
            - "null"
        python_executable:
          type:
            - string
            - "null"
        launch_command:
          type:
            - string
            - "null"
        environment:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
        pid:
          type:
            - integer
            - "null"
        log_path:
          type:
            - string
            - "null"
      additionalProperties: false
  model_profile_ref:
    type:
      - string
      - "null"
  candidate_evaluation_ref:
    type:
      - string
      - "null"
  placement_reason:
    type:
      - string
      - "null"
  conda_environment:
    type:
      - string
      - "null"
  conda_prefix:
    type:
      - string
      - "null"
  python_executable:
    type:
      - string
      - "null"
  parallel_plan_ref:
    type:
      - string
      - "null"
  original_engine_plan_ref:
    type:
      - string
      - "null"
  distributed_checkpoint_ref:
    type:
      - string
      - "null"
  consolidated_model_ref:
    type:
      - string
      - "null"
  reload_validation_ref:
    type:
      - string
      - "null"
  snapshot_ref:
    type:
      - string
      - "null"
  environment:
    type: object
    additionalProperties:
      type: string
  labels:
    type: object
    additionalProperties:
      type: string
additionalProperties: false
allOf:
  - properties:
      workers:
        uniqueItems: true
  - $comment: uniqueItems on whole objects is not enough for rank uniqueness; use the custom x-shardgrid rule below.
x-shardgrid-rules:
  unique_rank: workers[*].rank
  contiguous_ranks: true
  world_size_matches_workers: true
  automatic_partition_requires_profile_and_candidate_refs: true
